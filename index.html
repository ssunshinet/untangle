<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>풀어내기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #E8DCC4;
    color: #5C4332;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app {
    max-width: 440px;
    height: 100vh;
    margin: 0 auto;
    background: #F5EDE0;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }
  .screen::-webkit-scrollbar { display: none; }

  .bottom-nav {
    display: flex;
    justify-content: space-around;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    border-top: 0.5px solid rgba(101,72,51,0.1);
    background: #F5EDE0;
    flex-shrink: 0;
  }
  .nav-tab {
    background: transparent; border: none;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 6px 14px; cursor: pointer;
    color: #B8A48E; font-family: inherit; font-size: 11px;
    transition: color 0.2s;
  }
  .nav-tab.active { color: #5C4332; }
  .nav-tab svg { width: 22px; height: 22px; }

  .home {
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 20px) 24px 24px;
    min-height: 100%;
  }
  .home-top {
    display: flex; justify-content: flex-end;
    margin-bottom: 24px;
  }
  .menu-btn {
    background: transparent; border: none;
    color: #A89684; padding: 6px; cursor: pointer;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  }
  .home-main {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 20px 0;
  }
  .tangle-large {
    width: 220px; height: 220px;
    margin-bottom: 36px;
    animation: sway 7s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }
  .tangle-large .strands { animation: pulse 4.5s ease-in-out infinite; }
  .home-date {
    font-size: 13px; color: #A89684;
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }
  .home-greeting {
    font-family: 'Gowun Batang', serif;
    font-size: 24px; font-weight: 400;
    color: #5C4332;
    margin: 0 0 40px;
    text-align: center;
    line-height: 1.5;
  }
  .home-buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .start-btn {
    background: #FFFFFF;
    border: 0.5px solid rgba(101,72,51,0.15);
    color: #5C4332;
    padding: 16px 20px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    width: 100%;
    font-family: inherit;
    transition: all 0.2s;
  }
  .start-btn:active { transform: scale(0.98); background: #FBF6EE; }
  .start-btn svg { width: 20px; height: 20px; }
  .privacy-note {
    margin: 24px 0 0;
    font-size: 11px;
    color: #A89684;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .privacy-note svg { width: 11px; height: 11px; }

  .chat {
    display: flex; flex-direction: column;
    height: 100%;
  }
  .chat-header {
    padding: max(env(safe-area-inset-top), 16px) 20px 14px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 0.5px solid rgba(101,72,51,0.08);
    background: #F5EDE0;
  }
  .chat-back {
    background: transparent; border: none; padding: 4px;
    color: #5C4332; cursor: pointer;
    display: flex; align-items: center;
  }
  .chat-back svg { width: 22px; height: 22px; }
  .chat-title { flex: 1; font-size: 14px; color: #5C4332; font-weight: 500; }
  .chat-mode-switch {
    background: transparent; border: none;
    color: #A89684; padding: 4px; cursor: pointer;
  }
  .chat-mode-switch svg { width: 20px; height: 20px; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column;
    gap: 12px;
  }
  .messages::-webkit-scrollbar { display: none; }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: msgIn 0.25s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .msg.user {
    align-self: flex-end;
    background: #D89B7A;
    color: #FFFFFF;
    border-bottom-right-radius: 5px;
  }
  .msg.ai {
    align-self: flex-start;
    background: #FFFFFF;
    color: #5C4332;
    border-bottom-left-radius: 5px;
    border: 0.5px solid rgba(101,72,51,0.08);
  }
  .typing {
    align-self: flex-start;
    display: flex; gap: 4px;
    padding: 12px 14px;
    background: #FFFFFF;
    border: 0.5px solid rgba(101,72,51,0.08);
    border-radius: 18px;
    border-bottom-left-radius: 5px;
  }
  .typing span {
    width: 6px; height: 6px;
    background: #B8A48E;
    border-radius: 50%;
    animation: typingDot 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingDot {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  .composer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 0.5px solid rgba(101,72,51,0.08);
    background: #F5EDE0;
  }
  .composer textarea {
    flex: 1;
    border: 0.5px solid rgba(101,72,51,0.15);
    background: #FFFFFF;
    border-radius: 20px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 15px;
    color: #5C4332;
    resize: none;
    max-height: 100px;
    line-height: 1.4;
    outline: none;
  }
  .composer textarea:focus { border-color: #D89B7A; }
  .send-btn {
    width: 40px; height: 40px;
    background: #5C4332;
    color: #F5EDE0;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .send-btn:disabled {
    background: #C9BCA7;
    cursor: not-allowed;
  }
  .send-btn:not(:disabled):active { transform: scale(0.92); }
  .send-btn svg { width: 18px; height: 18px; }
  .end-bar {
    text-align: center;
    padding: 8px 16px 0;
  }
  .end-btn {
    background: transparent; border: none;
    color: #A89684; font-size: 12px;
    font-family: inherit; cursor: pointer;
    padding: 6px 12px;
  }

  .voice {
    height: 100%;
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 24px) 20px 24px;
  }
  .voice-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .voice-status {
    font-size: 13px; color: #A89684;
    text-align: center; flex: 1;
  }
  .voice-main {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
  }
  .voice-tangle {
    width: 280px; height: 200px;
    margin-bottom: 30px;
  }
  .strand-flow-1 { animation: flow1 5s ease-in-out infinite; transform-origin: center; }
  .strand-flow-2 { animation: flow2 6s ease-in-out infinite; transform-origin: center; }
  .strand-flow-3 { animation: flow3 4s ease-in-out infinite; }
  @keyframes flow1 {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(3px) rotate(1deg); }
  }
  @keyframes flow2 {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(-2px) rotate(-0.8deg); }
  }
  @keyframes flow3 {
    0%, 100% { transform: translateY(0); opacity: 0.5; }
    50% { transform: translateY(-2px); opacity: 0.7; }
  }
  .voice-prompt {
    font-family: 'Gowun Batang', serif;
    font-size: 17px;
    color: #5C4332;
    margin: 0 0 8px;
    text-align: center;
  }
  .voice-sub {
    font-size: 13px; color: #A89684;
    margin: 0 0 40px;
    text-align: center;
  }
  .voice-transcript {
    font-size: 13px;
    color: #7A5C4A;
    background: rgba(255,255,255,0.5);
    padding: 12px 16px;
    border-radius: 12px;
    margin: 0 0 24px;
    max-height: 80px;
    overflow-y: auto;
    text-align: center;
    line-height: 1.5;
    width: 100%;
  }
  .voice-controls {
    display: flex; justify-content: center;
    gap: 24px; align-items: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .voice-btn {
    background: transparent; border: none;
    color: #A89684; cursor: pointer;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
  }
  .voice-btn svg { width: 26px; height: 26px; }
  .voice-btn-main {
    background: #FFFFFF;
    border: 0.5px solid rgba(101,72,51,0.15);
    width: 64px; height: 64px;
    border-radius: 50%;
    color: #5C4332;
  }
  .voice-btn-main.recording {
    background: #D89B7A;
    color: #FFFFFF;
    animation: micPulse 2s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(216,155,122,0.4); }
    50% { box-shadow: 0 0 0 12px rgba(216,155,122,0); }
  }

  .list {
    padding: max(env(safe-area-inset-top), 24px) 20px 20px;
  }
  .list-header {
    margin-bottom: 24px;
  }
  .list-title {
    font-family: 'Gowun Batang', serif;
    font-size: 22px;
    color: #5C4332;
    margin: 0 0 4px;
    font-weight: 400;
  }
  .list-sub {
    font-size: 12px; color: #A89684;
    margin: 0;
  }
  .insight-banner {
    background: #EDE4D9;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 24px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .insight-banner svg { width: 18px; height: 18px; color: #7A5C4A; flex-shrink: 0; margin-top: 2px; }
  .insight-banner p {
    font-size: 13px; color: #5C4332;
    margin: 0; line-height: 1.5;
  }
  .insight-banner strong { font-weight: 500; }
  .day-label {
    font-size: 11px; color: #A89684;
    margin: 18px 4px 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }
  .day-label:first-child { margin-top: 4px; }
  .tangle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tangle-card {
    background: #FBF6EE;
    border: 0.5px solid rgba(101,72,51,0.12);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tangle-card:active { transform: scale(0.97); }
  .tangle-card-vis {
    height: 56px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
  }
  .tangle-card-day {
    font-size: 12px; color: #A89684;
    margin: 0 0 4px;
  }
  .tangle-card-title {
    font-size: 13px; color: #5C4332;
    font-weight: 500;
    margin: 0;
    line-height: 1.4;
  }
  .empty-msg {
    text-align: center;
    padding: 60px 20px;
    color: #A89684;
    font-size: 14px;
    line-height: 1.6;
  }

  .recovery {
    padding: max(env(safe-area-inset-top), 24px) 20px 20px;
  }
  .green-banner {
    background: #E8EFD9;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .green-banner-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .green-banner-top svg { width: 16px; height: 16px; color: #4A6B1F; }
  .green-banner-top span {
    font-size: 12px; color: #4A6B1F;
    font-weight: 500;
  }
  .green-banner p {
    font-size: 13px; color: #2F4515;
    margin: 0; line-height: 1.5;
  }
  .recovery-card {
    background: #FBF6EE;
    border: 0.5px solid rgba(101,72,51,0.12);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .recovery-card:active { transform: scale(0.98); background: #F5EDE0; }
  .recovery-card-menu {
    position: absolute;
    top: 8px; right: 8px;
    width: 28px; height: 28px;
    background: transparent; border: none;
    color: #A89684; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
  }
  .recovery-card-menu:hover { background: rgba(101,72,51,0.05); }
  .recovery-card-menu svg { width: 16px; height: 16px; }
  .recovery-card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 6px;
  }
  .recovery-card-left {
    display: flex; align-items: center; gap: 10px;
  }
  .recovery-card-left svg { width: 20px; height: 20px; color: #7A5C4A; }
  .recovery-card-left p {
    font-size: 14px; color: #5C4332;
    margin: 0; font-weight: 500;
  }
  .leaves {
    display: flex; gap: 2px;
  }
  .leaves svg { width: 13px; height: 13px; color: #4A6B1F; }
  .leaves .empty { color: #D5C9B6; }
  .recovery-meta {
    font-size: 12px; color: #A89684;
    margin: 0;
  }
  .add-recovery {
    background: rgba(255,255,255,0.5);
    border: 1px dashed rgba(101,72,51,0.25);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
    margin-top: 6px;
  }
  .add-recovery svg { width: 18px; height: 18px; color: #A89684; }
  .add-recovery span { font-size: 13px; color: #7A5C4A; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(46,30,18,0.5);
    display: flex; align-items: flex-end;
    z-index: 50;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .summary-card {
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: #FBF6EE;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    animation: slideUp 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .summary-card::-webkit-scrollbar { display: none; }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: none; }
  }
  .summary-grip {
    width: 40px; height: 4px;
    background: #C9BCA7;
    border-radius: 2px;
    margin: 0 auto 18px;
  }
  .summary-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 0.5px solid rgba(101,72,51,0.1);
  }
  .summary-meta-date {
    font-size: 12px; color: #A89684;
  }
  .summary-headline {
    font-family: 'Gowun Batang', serif;
    font-size: 19px; color: #5C4332;
    margin: 0 0 20px;
    line-height: 1.4;
  }
  .ba-comparison {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
    padding: 16px;
    background: #F5EDE0;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .ba-side { text-align: center; }
  .ba-side svg { width: 80px; height: 64px; }
  .ba-side p { font-size: 11px; margin: 4px 0 0; }
  .ba-before p { color: #A89684; }
  .ba-after p { color: #3B6D11; font-weight: 500; }
  .ba-arrow { color: #A89684; }
  .ba-arrow svg { width: 16px; height: 16px; }
  .section-label {
    font-size: 11px; color: #A89684;
    margin-bottom: 8px; font-weight: 500;
  }
  .emo-pills { margin-bottom: 18px; }
  .emo-pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    margin: 0 6px 6px 0;
  }
  .quote-box {
    background: #FFFFFF;
    border-left: 2px solid #D89B7A;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 0 8px 8px 0;
  }
  .quote-box p {
    font-size: 14px; color: #5C4332;
    margin: 0;
    font-style: italic;
    line-height: 1.6;
  }
  .quote-box small {
    font-size: 11px; color: #A89684;
    display: block; margin-top: 6px;
  }
  .summary-body {
    font-size: 14px; color: #5C4332;
    line-height: 1.65;
    margin: 0 0 18px;
  }
  .insight-box {
    background: #EDE4D9;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .insight-box small {
    font-size: 11px; color: #7A5C4A;
    font-weight: 500;
    display: block; margin-bottom: 4px;
  }
  .insight-box p {
    font-size: 14px; color: #5C4332;
    margin: 0; line-height: 1.6;
  }
  .tags { margin-bottom: 24px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: rgba(101,72,51,0.08);
    color: #7A5C4A;
    margin: 0 4px 4px 0;
  }
  .tag svg { width: 11px; height: 11px; }
  .confirm-area {
    padding-top: 14px;
    border-top: 0.5px solid rgba(101,72,51,0.1);
  }
  .confirm-q {
    font-size: 14px; color: #5C4332;
    margin: 0 0 12px;
    line-height: 1.5;
  }
  .confirm-buttons {
    display: flex; gap: 8px;
  }
  .confirm-btn {
    flex: 1;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .confirm-btn:active { transform: scale(0.97); }
  .confirm-primary {
    background: #5C4332;
    color: #F5EDE0;
    border: none;
  }
  .confirm-secondary {
    background: transparent;
    border: 0.5px solid rgba(101,72,51,0.2);
    color: #5C4332;
  }

  .processing {
    text-align: center;
    padding: 60px 20px;
  }
  .processing-circle {
    width: 80px; height: 80px;
    margin: 0 auto 20px;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  .processing p {
    font-size: 14px; color: #A89684;
    margin: 0;
  }

  .toast {
    position: absolute;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(46,30,18,0.9);
    color: #F5EDE0;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 100;
    animation: toastIn 0.3s ease;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .hidden { display: none !important; }

  .settings-menu {
    position: absolute;
    top: 60px; right: 20px;
    background: #FFFFFF;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(46,30,18,0.15);
    padding: 6px;
    z-index: 60;
    min-width: 180px;
  }
  .settings-item {
    padding: 10px 14px;
    font-size: 14px;
    color: #5C4332;
    cursor: pointer;
    border-radius: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .settings-item:hover { background: #F5EDE0; }
  .settings-item svg { width: 16px; height: 16px; color: #7A5C4A; }
  .settings-item.danger { color: #A03C3C; }
  .settings-item.danger svg { color: #A03C3C; }

  /* Recovery modal */
  .recovery-modal {
    width: 100%;
    max-width: 440px;
    background: #FBF6EE;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    animation: slideUp 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    margin: 0 auto;
  }
  .recovery-modal h3 {
    font-family: 'Gowun Batang', serif;
    font-size: 18px; font-weight: 400;
    color: #5C4332;
    margin: 0 0 6px;
  }
  .recovery-modal .modal-sub {
    font-size: 13px; color: #A89684;
    margin: 0 0 20px;
  }
  .modal-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: rgba(101,72,51,0.04);
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    color: #5C4332;
    font-size: 14px;
  }
  .modal-row:active { transform: scale(0.98); background: rgba(101,72,51,0.08); }
  .modal-row svg { width: 18px; height: 18px; color: #7A5C4A; flex-shrink: 0; }
  .modal-row.danger { color: #A03C3C; }
  .modal-row.danger svg { color: #A03C3C; }
  .modal-input {
    width: 100%;
    border: 0.5px solid rgba(101,72,51,0.15);
    background: #FFFFFF;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    color: #5C4332;
    outline: none;
    margin-bottom: 14px;
  }
  .modal-input:focus { border-color: #D89B7A; }
  .icon-picker {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .icon-option {
    aspect-ratio: 1;
    background: rgba(101,72,51,0.04);
    border: 1.5px solid transparent;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: #7A5C4A;
    transition: all 0.15s;
  }
  .icon-option:active { transform: scale(0.9); }
  .icon-option.selected {
    background: #EDE4D9;
    border-color: #D89B7A;
  }
  .icon-option svg { width: 20px; height: 20px; }
  .modal-buttons {
    display: flex; gap: 8px;
    margin-top: 18px;
  }
  .modal-btn {
    flex: 1;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    border: none;
  }
  .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .modal-btn-primary {
    background: #5C4332;
    color: #F5EDE0;
  }
  .modal-btn-secondary {
    background: transparent;
    border: 0.5px solid rgba(101,72,51,0.2);
    color: #5C4332;
  }
  .modal-label {
    font-size: 12px; color: #A89684;
    margin: 0 0 8px 2px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="screen" id="screen-home">
    <div class="home">
      <div class="home-top">
        <button class="menu-btn" onclick="toggleSettings()" aria-label="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
      </div>
      <div class="home-main">
        <svg class="tangle-large" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
          <g class="strands">
            <path d="M 50 110 Q 70 70, 110 80 T 170 110 Q 160 150, 120 145 T 70 130 Q 55 120, 60 100 T 110 95 Q 150 100, 155 130"
                  fill="none" stroke="#D89B7A" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
            <path d="M 60 100 Q 95 65, 140 85 T 175 130 Q 165 155, 115 150 T 65 125 Q 50 105, 75 90 T 130 100"
                  fill="none" stroke="#C9836A" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
            <path d="M 70 120 Q 100 90, 145 100 T 165 135 Q 145 150, 110 140 T 80 115 Q 75 100, 100 105"
                  fill="none" stroke="#B86F5C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

                  fill="none" stroke="#A8927E" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

        </svg>
        <p class="home-date" id="home-date">오늘이에요</p>
        <h2 class="home-greeting" id="home-greeting">오늘은 뭐가<br>마음에 걸려?</h2>
        <div class="home-buttons">
          <button class="start-btn" onclick="startVoice()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20l9-9-5-5-9 9v5z"/><line x1="17" y1="6" x2="21" y2="10"/></svg>
            글로 풀어내기

        <p class="privacy-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>

    </div>
    <div id="settings-menu" class="settings-menu hidden">
      <div class="settings-item" onclick="exportData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        기록 내보내기
      </div>
      <div class="settings-item" onclick="triggerImport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        기록 가져오기
      </div>
      <input type="file" id="import-input" accept=".json,application/json" style="display:none" onchange="handleImportFile(event)">
      <div class="settings-item" onclick="showAbout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        앱 소개
      </div>
      <div class="settings-item danger" onclick="resetData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        기록 모두 지우기
      </div>
    </div>
  </div>

  <div class="screen hidden" id="screen-chat">
    <div class="chat">
      <div class="chat-header">
        <button class="chat-back" onclick="goHome()" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="chat-title">친구</div>
        <button class="chat-mode-switch" onclick="switchToVoice()" aria-label="음성으로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/></svg>
        </button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="end-bar" id="end-bar"></div>
      <div class="composer">
        <textarea id="composer-input" placeholder="편하게 써봐..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled aria-label="보내기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="screen hidden" id="screen-voice">
    <div class="voice">
      <div class="voice-header">
        <button class="chat-back" onclick="goHome()" aria-label="뒤로">

        </button>
        <div class="voice-status">친구랑 통화 중</div>
        <button class="chat-mode-switch" onclick="switchToChat()" aria-label="글로 전환">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20l9-9-5-5-9 9v5z"/></svg>
        </button>
      </div>
      <div class="voice-main">
        <svg class="voice-tangle" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">

                  fill="none" stroke="#D89B7A" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
          </g>
          <g class="strand-flow-2">
            <path d="M 30 115 Q 70 100, 110 110 T 180 120 Q 210 130, 240 115 T 260 110"
                  fill="none" stroke="#C9836A" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
          </g>
          <g class="strand-flow-1">
            <path d="M 30 85 Q 65 70, 105 80 T 175 95 Q 205 100, 235 80 T 260 78"
                  fill="none" stroke="#B86F5C" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
          </g>
          <g class="strand-flow-3">
            <path d="M 30 130 Q 80 120, 120 128 T 190 135 Q 220 138, 250 128"
                  fill="none" stroke="#A8927E" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
        <p class="voice-prompt" id="voice-prompt">편하게 얘기해</p>
        <p class="voice-sub" id="voice-sub">마이크 눌러서 말 시작해</p>
        <div class="voice-transcript hidden" id="voice-transcript"></div>
      </div>
      <div class="voice-controls">
        <button class="voice-btn" onclick="switchToChat()" aria-label="글로 전환">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20l9-9-5-5-9 9v5z"/></svg>
        </button>
        <button class="voice-btn voice-btn-main" id="mic-btn" onclick="toggleMic()" aria-label="말하기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        </button>
        <button class="voice-btn" id="voice-end-btn" onclick="endVoiceSession()" aria-label="끝내기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="screen hidden" id="screen-list">
    <div class="list">
      <div class="list-header">
        <h2 class="list-title">풀어낸 것들</h2>
        <p class="list-sub" id="list-count">아직 비어있어요</p>
      </div>
      <div id="list-insight" class="hidden"></div>
      <div id="list-content"></div>
    </div>
  </div>

  <div class="screen hidden" id="screen-recovery">
    <div class="recovery">
      <div class="list-header">
        <h2 class="list-title">나의 회복</h2>
        <p class="list-sub">기분 좋아지는 나만의 방법들</p>
      </div>
      <div id="recovery-banner"></div>
      <p class="day-label">시작해볼 만한 것들</p>
      <div id="recovery-list"></div>
      <div class="add-recovery" onclick="openAddRecovery()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>나만의 회복 방법 추가하기</span>
      </div>

  <div class="overlay hidden" id="recovery-modal-overlay">
    <div class="recovery-modal" id="recovery-modal"></div>
  </div>

  <div class="bottom-nav" id="bottom-nav">
    <button class="nav-tab active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12c-3-2-6-2-9-2s-6 0-9 2c3 2 6 2 9 2s6 0 9-2z"/><path d="M21 12c-3 2-6 2-9 2s-6 0-9-2"/></svg>
      지금
    </button>
    <button class="nav-tab" data-tab="list" onclick="switchTab('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      풀어낸 것들
    </button>
    <button class="nav-tab" data-tab="recovery" onclick="switchTab('recovery')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.05 8.05a7 7 0 0 1 11.9 4.95M11 3v3M3 11h3"/><path d="M12 22a10 10 0 0 0 0-20"/></svg>
      나의 회복
    </button>
  </div>

  <div class="overlay hidden" id="summary-overlay">
    <div class="summary-card" id="summary-card"></div>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>

<script>
  let session = { mode: null, messages: [], startTime: null };
  let isRecording = false;
  let recognition = null;
  let voiceTranscriptBuffer = '';
  let entries = JSON.parse(localStorage.getItem('untangle-entries') || '[]');
  let currentTab = 'home';

  // Recovery state
  const DEFAULT_RECOVERIES = [
    { id: 'walk', name: '저녁 산책 30분', icon: 'walk', logs: [] },
    { id: 'tea', name: '좋아하는 차 한 잔', icon: 'tea', logs: [] },
    { id: 'call', name: '친한 사람과 통화', icon: 'call', logs: [] }
  ];
  let recoveries = JSON.parse(localStorage.getItem('untangle-recoveries') || 'null') || DEFAULT_RECOVERIES;
  let pendingRecoveryIcon = 'leaf';
  let editingRecoveryId = null;

  // Icon library
  const RECOVERY_ICONS = {
    walk: '<path d="M13 4v16M5 12h16M9 8l-4 4 4 4"/>',
    tea: '<path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>',
    call: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    leaf: '<path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z" fill="currentColor"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    bath: '<path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M2 12h20"/><path d="M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
    pen: '<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/>',
    yoga: '<circle cx="12" cy="5" r="2"/><path d="M12 7v6M6 21l6-8 6 8M9 13l3-3 3 3"/>',
    food: '<path d="M3 11h18M5 11l1 9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-9"/><path d="M12 11V7"/><circle cx="12" cy="5" r="1.5"/>',
    home: '<path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>'
  };
  const ICON_OPTIONS = ['walk', 'tea', 'call', 'book', 'music', 'bath', 'sun', 'pen', 'yoga', 'food', 'home', 'leaf'];

  function init() {
    setGreeting();
    updateListScreen();
    updateRecoveryScreen();

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.lang = 'ko-KR';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onresult = handleSpeechResult;
      recognition.onerror = handleSpeechError;
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('settings-menu');
      if (!menu.contains(e.target) && !e.target.closest('.menu-btn')) {
        menu.classList.add('hidden');
      }
    });
  }

  function setGreeting() {
    const h = new Date().getHours();
    let timeOfDay = '오늘이에요';
    let greeting = '오늘은 뭐가<br>마음에 걸려?';
    if (h < 6) { timeOfDay = '늦은 밤이에요'; greeting = '잠 못 들게 하는 게<br>뭐가 있어?'; }
    else if (h < 12) { timeOfDay = '아침이에요'; greeting = '오늘 마음에<br>걸린 게 있어?'; }
    else if (h < 18) { timeOfDay = '낮 시간이에요'; greeting = '뭐가 답답해?<br>편하게 얘기해.'; }
    else if (h < 22) { timeOfDay = '저녁이에요'; greeting = '오늘 어땠어?<br>풀고 싶은 거 있어?'; }
    else { timeOfDay = '밤이에요'; greeting = '잠들기 전에<br>뭐 풀고 가고 싶어?'; }
    document.getElementById('home-date').innerHTML = timeOfDay;
    document.getElementById('home-greeting').innerHTML = greeting;
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-' + tab).classList.remove('hidden');
    if (tab === 'list') updateListScreen();
    if (tab === 'recovery') updateRecoveryScreen();
    if (tab === 'home') document.getElementById('bottom-nav').classList.remove('hidden');
  }

  function goHome() {
    if (session.messages.length > 0) {
      if (!confirm('지금까지 한 얘기는 저장되지 않아. 정말 나갈까?')) return;
    }
    session = { mode: null, messages: [], startTime: null };
    if (isRecording) stopRecording();
    document.getElementById('bottom-nav').classList.remove('hidden');
    switchTab('home');
  }

  function toggleSettings() {
    document.getElementById('settings-menu').classList.toggle('hidden');
  }
  function resetData() {
    if (confirm('모든 기록을 지울까? (풀어낸 것들 + 회복 방법 둘 다) 되돌릴 수 없어.')) {
      localStorage.removeItem('untangle-entries');
      localStorage.removeItem('untangle-recoveries');
      entries = [];
      recoveries = JSON.parse(JSON.stringify(DEFAULT_RECOVERIES));
      updateListScreen();
      updateRecoveryScreen();
      toast('초기화 됐어요');
    }
    document.getElementById('settings-menu').classList.add('hidden');
  }
  function showAbout() {
    document.getElementById('settings-menu').classList.add('hidden');
    alert('"풀어내기"는 마음에 걸린 감정을 친구한테 털어놓듯 풀어내고, 나만의 회복법을 발견하는 앱입니다.\n\n모든 데이터는 이 기기에만 저장돼요. 다른 기기로 옮기고 싶다면 설정에서 기록 내보내기를 사용하세요.');
  }

  function exportData() {
    document.getElementById('settings-menu').classList.add('hidden');
    if (entries.length === 0 && recoveries.every(r => r.logs.length === 0)) {
      toast('아직 내보낼 기록이 없어요');
      return;
    }
    const data = {
      app: 'untangle',
      version: 2,
      exportedAt: new Date().toISOString(),
      entries: entries,
      recoveries: recoveries
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `untangle-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('기록을 내보냈어요');
  }

  function triggerImport() {
    document.getElementById('settings-menu').classList.add('hidden');
    document.getElementById('import-input').click();
  }

  function handleImportFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.entries || !Array.isArray(data.entries)) {
          throw new Error('잘못된 파일');
        }
        const existingKeys = new Set(entries.map(en => `${en.date}|${en.headline}`));
        const newEntries = data.entries.filter(en =>
          en.date && en.headline && !existingKeys.has(`${en.date}|${en.headline}`)
        );

        // recoveries 병합 (있으면)
        let mergedRecoveries = 0;
        if (data.recoveries && Array.isArray(data.recoveries)) {
          const existingIds = new Set(recoveries.map(r => r.id));
          data.recoveries.forEach(impR => {
            if (!existingIds.has(impR.id)) {
              recoveries.push(impR);
              mergedRecoveries++;
            }
          });
        }

        if (newEntries.length === 0 && mergedRecoveries === 0) {
          toast('새로 가져올 게 없어요');
          return;
        }

        let msg = '';
        if (newEntries.length > 0) msg += `풀어낸 기록 ${newEntries.length}개`;
        if (mergedRecoveries > 0) msg += (msg ? ', ' : '') + `회복 방법 ${mergedRecoveries}개`;
        const proceed = confirm(`${msg}를 가져올까요?`);
        if (!proceed) {
          // recoveries는 이미 추가됐으니 rollback
          if (mergedRecoveries > 0) {
            const importedIds = new Set(data.recoveries.map(r => r.id));
            recoveries = recoveries.filter(r => !importedIds.has(r.id) || DEFAULT_RECOVERIES.some(d => d.id === r.id));
          }
          return;
        }

        entries = [...newEntries, ...entries].sort((a, b) =>
          new Date(b.date) - new Date(a.date)
        );
        localStorage.setItem('untangle-entries', JSON.stringify(entries));
        saveRecoveries();
        updateListScreen();
        updateRecoveryScreen();
        toast('가져왔어요');
        switchTab('list');
      } catch (err) {
        console.error(err);
        alert('파일을 읽을 수 없어요. 풀어내기 백업 파일이 맞는지 확인해주세요.');
      } finally {
        event.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  async function startChat() {
    document.getElementById('bottom-nav').classList.add('hidden');
    session.mode = 'chat';
    session.startTime = Date.now();
    session.messages = [];
    document.getElementById('messages').innerHTML = '';
    document.getElementById('end-bar').innerHTML = '';
    document.getElementById('composer-input').value = '';
    autoResize(document.getElementById('composer-input'));
    document.getElementById('send-btn').disabled = true;

    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-chat').classList.remove('hidden');

    await new Promise(r => setTimeout(r, 400));
    addAIMessage(getOpeningMessage());
  }

  function getOpeningMessage() {
    const h = new Date().getHours();
    const options = [
      '왔어. 뭔 일 있었어?',
      '편하게 얘기해. 뭐가 답답해?',
      '어, 왔구나. 무슨 일이야?',
    ];
    if (h >= 22 || h < 6) options.push('이 시간에 왔으니 뭐 좀 있나봐. 말해봐.');
    return options[Math.floor(Math.random() * options.length)];
  }

  function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
    document.getElementById('send-btn').disabled = textarea.value.trim().length === 0;
  }

  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!document.getElementById('send-btn').disabled) sendMessage();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('composer-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    autoResize(input);
    document.getElementById('send-btn').disabled = true;
    addUserMessage(text);

    const typingId = showTyping();
    try {
      const response = await callBackend('chat', { messages: session.messages });
      removeElement(typingId);
      const bubbles = splitIntoBubbles(response);
      for (let i = 0; i < bubbles.length; i++) {
        if (i > 0) await new Promise(r => setTimeout(r, 600));
        addAIMessage(bubbles[i]);
      }
      if (session.messages.filter(m => m.role === 'user').length >= 3) showEndButton();
    } catch (e) {
      removeElement(typingId);
      addAIMessage('잠깐, 뭔가 잘못됐어. 다시 말해줄래?');
      console.error(e);
    }
  }

  function splitIntoBubbles(text) {
    if (text.length < 60) return [text];
    const parts = text.split(/\n\n+/).filter(p => p.trim());
    if (parts.length > 1 && parts.length <= 3) return parts.map(p => p.trim());
    return [text];
  }

  function addUserMessage(text) {
    session.messages.push({ role: 'user', content: text });
    const div = document.createElement('div');
    div.className = 'msg user';
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    scrollMessagesToBottom();
  }

  function addAIMessage(text) {
    session.messages.push({ role: 'assistant', content: text });
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    scrollMessagesToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    const id = 'typing-' + Date.now();
    div.id = id;
    div.className = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    document.getElementById('messages').appendChild(div);
    scrollMessagesToBottom();
    return id;
  }

  function removeElement(id) { const el = document.getElementById(id); if (el) el.remove(); }

  function scrollMessagesToBottom() {
    const m = document.getElementById('messages');
    setTimeout(() => { m.scrollTop = m.scrollHeight; }, 50);
  }

  function showEndButton() {
    const bar = document.getElementById('end-bar');

  function startVoice() {

  function toggleMic() {
    if (!recognition) return;
    if (isRecording) stopRecording();
    else startRecording();
  }

  function startRecording() {
    try {
      recognition.start();
      isRecording = true;
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('voice-prompt').textContent = '듣고 있어';
      document.getElementById('voice-sub').textContent = '편하게 풀어내봐';
    } catch (e) { console.error(e); }
  }

  function stopRecording() {
    if (recognition && isRecording) { try { recognition.stop(); } catch(e) {} }
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
  }

  async function handleSpeechResult(event) {
    let interim = '';
    let final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += t;
      else interim += t;
    }
    const transcript = document.getElementById('voice-transcript');
    transcript.classList.remove('hidden');
    if (final) {
      voiceTranscriptBuffer += final + ' ';
      transcript.textContent = voiceTranscriptBuffer;
      await new Promise(r => setTimeout(r, 1200));
      if (!isRecording || (interim && interim.trim().length > 0)) return;
      if (voiceTranscriptBuffer.trim().length > 5) {
        stopRecording();
        await processVoiceTurn(voiceTranscriptBuffer.trim());
      }
    } else if (interim) {
      transcript.textContent = voiceTranscriptBuffer + interim;
    }
  }

  function handleSpeechError(e) {
    console.warn('Speech error:', e.error);
    stopRecording();
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      document.getElementById('voice-prompt').textContent = '마이크 권한이 필요해';
      document.getElementById('voice-sub').textContent = '브라우저 설정에서 허용해줘';
    }
  }

  async function processVoiceTurn(userText) {
    session.messages.push({ role: 'user', content: userText });
    voiceTranscriptBuffer = '';
    document.getElementById('voice-transcript').classList.add('hidden');
    document.getElementById('voice-prompt').textContent = '...';
    document.getElementById('voice-sub').textContent = '듣고 있었어';

    try {
      const response = await callBackend('chat', { messages: session.messages });
      session.messages.push({ role: 'assistant', content: response });
      document.getElementById('voice-prompt').textContent = response;
      document.getElementById('voice-sub').textContent = '마이크 눌러서 계속 말해';
      speakText(response);
    } catch (e) {
      document.getElementById('voice-prompt').textContent = '뭔가 잘못됐어';
      document.getElementById('voice-sub').textContent = '다시 말해줄래?';
    }
  }

  function speakText(text) {
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = 1.0;
    utter.pitch = 1.0;
    window.speechSynthesis.speak(utter);
  }

  function endVoiceSession() {
    stopRecording();
    if (session.messages.filter(m => m.role === 'user').length < 1) {
      toast('얘기를 좀 해야 정리할 수 있어');
      return;

    if (!recognition) { toast('이 브라우저는 음성이 안 돼'); return; }
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));

  function switchToChat() {
    stopRecording();
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-chat').classList.remove('hidden');
    session.mode = 'chat';
    const m = document.getElementById('messages');
    m.innerHTML = '';
    session.messages.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
      div.textContent = msg.content;
      m.appendChild(div);
    });
    if (session.messages.length === 0) addAIMessage(getOpeningMessage());
    if (session.messages.filter(msg => msg.role === 'user').length >= 3) showEndButton();

  async function callBackend(action, payload) {
    const response = await fetch('/api/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) {
      const errorText = await response.text();
      throw new Error('API error: ' + response.status + ' ' + errorText);
    }
    const data = await response.json();
    return data.response;
  }

  function updateListScreen() {
    const countEl = document.getElementById('list-count');
    const insightEl = document.getElementById('list-insight');
    const contentEl = document.getElementById('list-content');

    if (entries.length === 0) {
      countEl.textContent = '아직 풀어낸 게 없어요';
      insightEl.classList.add('hidden');
      contentEl.innerHTML = `<div class="empty-msg">
        마음에 걸리는 게 있으면<br>
        "지금" 탭에서 풀어내봐.<br><br>
        풀어낸 것들이 여기 쌓일 거예요.
      </div>`;
      return;
    }

    countEl.textContent = `지금까지 ${entries.length}개 풀어냈어요`;

    if (entries.length >= 2) {
      insightEl.classList.remove('hidden');
      const recentResolved = entries.slice(0, 5).filter(e => e.resolved).length;
      insightEl.innerHTML = `<div class="insight-banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>
        <p>최근에 ${recentResolved}번 정도 마음이 풀렸어요.</p>
      </div>`;
    } else {
      insightEl.classList.add('hidden');
    }

    const groups = groupByDay(entries);
    let html = '';
    for (const [label, items] of groups) {
      html += `<p class="day-label">${label}</p><div class="tangle-grid">`;
      items.forEach((entry) => {
        const globalIdx = entries.indexOf(entry);
        html += renderEntryCard(entry, globalIdx);
      });
      html += `</div>`;
    }
    contentEl.innerHTML = html;
  }

  function groupByDay(items) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const groups = new Map();
    items.forEach(entry => {
      const d = new Date(entry.date);
      const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      const diff = Math.round((today - day) / 86400000);
      let label;
      if (diff === 0) label = '오늘';
      else if (diff === 1) label = '어제';
      else if (diff < 7) label = '이번 주';
      else if (diff < 14) label = '지난주';
      else label = '그 이전';
      if (!groups.has(label)) groups.set(label, []);
      groups.get(label).push(entry);
    });
    return groups;
  }

  function renderEntryCard(entry, idx) {
    const date = new Date(entry.date);
    const dayName = ['일','월','화','수','목','금','토'][date.getDay()];
    const tangleSvg = entry.resolved ?
      `<svg viewBox="0 0 80 50" style="width:76px;height:46px">
        <path d="M 10 18 Q 40 16, 70 20" fill="none" stroke="#D89B7A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 10 28 Q 40 26, 70 30" fill="none" stroke="#C9836A" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
        <path d="M 10 38 Q 40 36, 70 40" fill="none" stroke="#A8927E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      </svg>` :
      `<svg viewBox="0 0 80 50" style="width:76px;height:46px">
        <path d="M 15 22 Q 35 14, 55 24 Q 70 30, 60 18 Q 45 12, 30 28" fill="none" stroke="#B86F5C" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        <path d="M 15 32 Q 40 28, 65 34" fill="none" stroke="#A8927E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>`;
    return `<div class="tangle-card" onclick="viewEntry(${idx})">
      <div class="tangle-card-vis">${tangleSvg}</div>
      <p class="tangle-card-day">${dayName}요일</p>
      <p class="tangle-card-title">${escapeHtml(entry.headline)}</p>
    </div>`;
  }

  function viewEntry(idx) {
    const entry = entries[idx];
    if (!entry) return;
    session.startTime = new Date(entry.date).getTime();
    showSummary(entry);
    setTimeout(() => {
      const confirmArea = document.querySelector('.confirm-area');
      if (confirmArea) {
        confirmArea.innerHTML = `
          <div class="confirm-buttons">
            <button class="confirm-btn confirm-secondary" onclick="closeOverlay()">닫기</button>
            <button class="confirm-btn confirm-secondary" onclick="deleteEntry(${idx})" style="color:#A03C3C">버리기</button>
          </div>`;
      }
    }, 100);
  }

  function deleteEntry(idx) {
    if (!confirm('이 기록을 버릴까?')) return;
    entries.splice(idx, 1);
    localStorage.setItem('untangle-entries', JSON.stringify(entries));
    closeOverlay();
    updateListScreen();
    toast('버렸어요');
  }

  function closeOverlay() {
    document.getElementById('summary-overlay').classList.add('hidden');
  }

  // ===== Recovery functions =====
  function saveRecoveries() {
    localStorage.setItem('untangle-recoveries', JSON.stringify(recoveries));
  }

  function getRecoveryIconSvg(iconKey, filled) {
    const path = RECOVERY_ICONS[iconKey] || RECOVERY_ICONS.leaf;
    const stroke = filled ? 'currentColor' : 'currentColor';
    return `<svg viewBox="0 0 24 24" fill="${iconKey === 'leaf' ? 'currentColor' : 'none'}" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
  }

  function renderLeaves(logs) {
    // 최근 4회 로그를 잎으로 표시
    // log.effect: 'good' | 'neutral' | 'bad'
    const recent = logs.slice(-4);
    const slots = [];
    for (let i = 0; i < 4; i++) {
      const log = recent[i];
      if (!log) {
        slots.push('<svg viewBox="0 0 24 24" fill="currentColor" class="empty"><path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z"/></svg>');
      } else if (log.effect === 'good') {
        slots.push('<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z"/></svg>');
      } else {
        slots.push('<svg viewBox="0 0 24 24" fill="currentColor" style="color:#C9BCA7"><path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z"/></svg>');
      }
    }
    return slots.join('');
  }

  function formatRelativeTime(isoDate) {
    const now = new Date();
    const then = new Date(isoDate);
    const diffMs = now - then;
    const diffMin = Math.floor(diffMs / 60000);
    const diffHr = Math.floor(diffMin / 60);
    const diffDay = Math.floor(diffHr / 24);
    if (diffMin < 1) return '방금';
    if (diffMin < 60) return diffMin + '분 전';
    if (diffHr < 24) return diffHr + '시간 전';
    if (diffDay === 1) return '어제';
    if (diffDay < 7) return diffDay + '일 전';
    return Math.floor(diffDay / 7) + '주 전';
  }

  function getRecoveryMetaText(rec) {
    if (rec.logs.length === 0) return '아직 안 해봤어요';
    const last = rec.logs[rec.logs.length - 1];
    const total = rec.logs.length;
    const goodCount = rec.logs.filter(l => l.effect === 'good').length;
    if (total === 1) return formatRelativeTime(last.date) + '에 해봤어요';
    return `${formatRelativeTime(last.date)} · 총 ${total}번 · ${goodCount}번 도움 됨`;
  }

  function updateRecoveryScreen() {
    const listEl = document.getElementById('recovery-list');
    const bannerEl = document.getElementById('recovery-banner');

    // Banner: 인사이트 또는 기본 안내
    const allLogs = recoveries.flatMap(r => r.logs.map(l => ({ ...l, name: r.name })));
    if (allLogs.length >= 3) {
      // 효과 좋았던 회복법 찾기
      const stats = recoveries
        .map(r => ({
          name: r.name,
          goodRate: r.logs.length > 0 ? r.logs.filter(l => l.effect === 'good').length / r.logs.length : 0,
          count: r.logs.length
        }))
        .filter(s => s.count >= 2)
        .sort((a, b) => b.goodRate - a.goodRate);

      if (stats.length > 0 && stats[0].goodRate >= 0.5) {
        bannerEl.innerHTML = `<div class="green-banner">
          <div class="green-banner-top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z"/><path d="M12 16v6"/></svg>
            <span>발견한 것</span>
          </div>
          <p><strong>${escapeHtml(stats[0].name)}</strong>가 가장 도움이 됐어요.</p>
        </div>`;
      } else {
        bannerEl.innerHTML = '';
      }
    } else {
      bannerEl.innerHTML = `<div class="green-banner">
        <div class="green-banner-top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z"/><path d="M12 16v6"/></svg>
          <span>이런 게 도움 될 수도</span>
        </div>
        <p>마음 풀어낸 후에 뭐 했을 때 좋았는지 여기 기록해봐. 시간이 지나면 나만의 회복법이 보일 거예요.</p>
      </div>`;
    }

    if (recoveries.length === 0) {
      listEl.innerHTML = `<div class="empty-msg" style="padding:30px 20px">
        회복 방법이 없어요.<br>아래 + 버튼으로 추가해봐.
      </div>`;
      return;
    }

    listEl.innerHTML = recoveries.map(rec => `
      <div class="recovery-card" onclick="logRecovery('${rec.id}')">
        <button class="recovery-card-menu" onclick="event.stopPropagation(); openRecoveryMenu('${rec.id}')" aria-label="메뉴">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
        <div class="recovery-card-top">
          <div class="recovery-card-left">
            ${getRecoveryIconSvg(rec.icon, false)}
            <p>${escapeHtml(rec.name)}</p>
          </div>
          <div class="leaves">
            ${renderLeaves(rec.logs)}
          </div>
        </div>
        <p class="recovery-meta">${getRecoveryMetaText(rec)}</p>
      </div>
    `).join('');
  }

  // 카드 클릭: 효과 평가 모달 띄움
  function logRecovery(id) {
    const rec = recoveries.find(r => r.id === id);
    if (!rec) return;
    showRecoveryEffectModal(rec);
  }

  function showRecoveryEffectModal(rec) {
    const modal = document.getElementById('recovery-modal');
    modal.innerHTML = `
      <h3>${escapeHtml(rec.name)}</h3>
      <p class="modal-sub">방금 해봤어? 어땠어?</p>
      <button class="modal-row" onclick="recordEffect('${rec.id}', 'good')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z" fill="#4A6B1F" stroke="#4A6B1F"/></svg>
        도움 됐어
      </button>
      <button class="modal-row" onclick="recordEffect('${rec.id}', 'neutral')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C8 6 8 12 12 16C16 12 16 6 12 2Z"/></svg>
        그냥 그랬어
      </button>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-secondary" onclick="closeRecoveryModal()">취소</button>
      </div>
    `;
    document.getElementById('recovery-modal-overlay').classList.remove('hidden');
  }

  function recordEffect(id, effect) {
    const rec = recoveries.find(r => r.id === id);
    if (!rec) return;
    rec.logs.push({
      date: new Date().toISOString(),
      effect: effect
    });
    saveRecoveries();
    closeRecoveryModal();
    toast(effect === 'good' ? '도움 됐다고 기록했어요' : '기록했어요');
    updateRecoveryScreen();
  }

  // 점 3개 메뉴
  function openRecoveryMenu(id) {
    const rec = recoveries.find(r => r.id === id);
    if (!rec) return;
    const modal = document.getElementById('recovery-modal');
    modal.innerHTML = `
      <h3>${escapeHtml(rec.name)}</h3>
      <p class="modal-sub">${rec.logs.length}번 기록됨</p>
      <button class="modal-row" onclick="editRecovery('${rec.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        이름 바꾸기
      </button>
      ${rec.logs.length > 0 ? `<button class="modal-row" onclick="clearRecoveryLogs('${rec.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        기록 초기화 (잎 비우기)
      </button>` : ''}
      <button class="modal-row danger" onclick="deleteRecovery('${rec.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        이 회복 방법 버리기
      </button>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-secondary" onclick="closeRecoveryModal()">닫기</button>
      </div>
    `;
    document.getElementById('recovery-modal-overlay').classList.remove('hidden');
  }

  function editRecovery(id) {
    const rec = recoveries.find(r => r.id === id);
    if (!rec) return;
    editingRecoveryId = id;
    pendingRecoveryIcon = rec.icon;
    showAddEditModal(rec);
  }

  function clearRecoveryLogs(id) {
    if (!confirm('이 방법의 기록을 모두 비울까? 잎이 다시 비어있게 돼.')) return;
    const rec = recoveries.find(r => r.id === id);
    if (!rec) return;
    rec.logs = [];
    saveRecoveries();
    closeRecoveryModal();
    updateRecoveryScreen();
    toast('비웠어요');
  }

  function deleteRecovery(id) {
    const rec = recoveries.find(r => r.id === id);
    if (!rec) return;
    if (!confirm(`"${rec.name}"을(를) 정말 버릴까?`)) return;
    recoveries = recoveries.filter(r => r.id !== id);
    saveRecoveries();
    closeRecoveryModal();
    updateRecoveryScreen();
    toast('버렸어요');
  }

  // 추가 버튼
  function openAddRecovery() {
    editingRecoveryId = null;
    pendingRecoveryIcon = 'leaf';
    showAddEditModal(null);
  }

  function showAddEditModal(rec) {
    const isEdit = !!rec;
    const modal = document.getElementById('recovery-modal');
    modal.innerHTML = `
      <h3>${isEdit ? '회복 방법 바꾸기' : '새 회복 방법'}</h3>
      <p class="modal-sub">${isEdit ? '이름이나 아이콘을 바꿀 수 있어' : '뭘 할 때 기분이 좋아져?'}</p>
      <p class="modal-label">이름</p>
      <input class="modal-input" id="recovery-name-input" placeholder="예: 산책, 음악 듣기, 게임..." value="${isEdit ? escapeHtml(rec.name) : ''}" oninput="updateAddBtnState()">
      <p class="modal-label">아이콘</p>
      <div class="icon-picker" id="icon-picker">
        ${ICON_OPTIONS.map(key => `
          <button class="icon-option ${key === pendingRecoveryIcon ? 'selected' : ''}" onclick="selectIcon('${key}')">
            ${getRecoveryIconSvg(key, false)}
          </button>
        `).join('')}
      </div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-secondary" onclick="closeRecoveryModal()">취소</button>
        <button class="modal-btn modal-btn-primary" id="recovery-save-btn" onclick="saveRecoveryFromModal()" ${isEdit ? '' : 'disabled'}>저장</button>
      </div>
    `;
    document.getElementById('recovery-modal-overlay').classList.remove('hidden');
    setTimeout(() => {
      const input = document.getElementById('recovery-name-input');
      if (input && !isEdit) input.focus();
    }, 300);
  }

  function updateAddBtnState() {
    const input = document.getElementById('recovery-name-input');
    const btn = document.getElementById('recovery-save-btn');
    if (input && btn) btn.disabled = input.value.trim().length === 0;
  }

  function selectIcon(key) {
    pendingRecoveryIcon = key;
    document.querySelectorAll('#icon-picker .icon-option').forEach((el, i) => {
      el.classList.toggle('selected', ICON_OPTIONS[i] === key);
    });
  }

  function saveRecoveryFromModal() {
    const input = document.getElementById('recovery-name-input');
    const name = input ? input.value.trim() : '';
    if (!name) return;

    if (editingRecoveryId) {
      const rec = recoveries.find(r => r.id === editingRecoveryId);
      if (rec) {
        rec.name = name;
        rec.icon = pendingRecoveryIcon;
      }
      toast('바꿨어요');
    } else {
      recoveries.push({
        id: 'r_' + Date.now(),
        name: name,
        icon: pendingRecoveryIcon,
        logs: []
      });
      toast('추가했어요');
    }
    saveRecoveries();
    editingRecoveryId = null;
    closeRecoveryModal();
    updateRecoveryScreen();
  }

  function closeRecoveryModal() {
    document.getElementById('recovery-modal-overlay').classList.add('hidden');
  }
  // 클릭 외부 닫기
  document.addEventListener('click', (e) => {
    const overlay = document.getElementById('recovery-modal-overlay');
    if (overlay && e.target === overlay) {
      closeRecoveryModal();
    }
  });

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2200);
  }

  init();
</script>
</body>
</html>
